version: '3.8'

services:
  api-gateway:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - VECTOR_DB_URL=http://qdrant:6333
      - USE_CUDA=false
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    depends_on:
      - qdrant

  training-orchestrator:
    build: .
    command: python -m src.orchestrator.training
    volumes:
      - .:/app
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - USE_CUDA=false
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
